[workspace]
resolver = "2"
members = [
    "conr-shared",
    "conr-server",
    "conr-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/coobyk/conr"

[workspace.dependencies]
conr-shared = { path = "conr-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
xid = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
